name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

env:
  RUST_TOOLCHAIN: 1.90.0

jobs:
  clippy:
    name: Clippy (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Clippy on every crate (configuration in scripts/clippy.sh)
        run: ./scripts/clippy.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=error
